# Game Wire 週刊ビルド・デプロイワークフロー
# 毎週土曜日 AM 6:00 (JST) に自動実行

name: Weekly Build and Deploy

on:
  # 定期実行: 毎週土曜日 AM 6:00 JST (= 金曜日 UTC 21:00)
  schedule:
    - cron: '0 21 * * 5'

  # 手動実行も可能
  workflow_dispatch:
    inputs:
      publish_date:
        description: '発行日 (YYYY-MM-DD形式、空欄で当日)'
        required: false
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write

    steps:
      # 1. リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js をセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 依存関係をインストール
      - name: Install dependencies
        run: npm ci

      # 4. データ取得（Steam, YouTube, IGDB, Metacritic）+ 公式日本語URL取得
      - name: Fetch game data
        run: npm run fetch-data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}

      # 5. 記事生成（Bedrock Claude + 画像生成 + Web検索 + IGDB画像取得）
      - name: Generate articles
        run: npm run generate
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PUBLISH_DATE: ${{ inputs.publish_date }}

      # 6. 号を組み立て
      - name: Build issue
        run: npx tsx scripts/build-issue.ts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      # 6.1. 今回生成した号のバリデーションレポートを特定
      #      Issue番号は常に既存の最大値+1（getNextIssueNumber の仕様、build-issue.ts:85-97）
      #      なので src/content/issues/issue-*.md の最大値から逆引きしてレポートパスを固定する。
      #      号の再利用（削除→再発行）があるため、単純に ls | sort | tail では最新の号ではなく
      #      番号が一番大きい古い残骸を拾ってしまう（2026-08-14 の本番実測 = run 31792016284:
      #      Vol.17 再利用時に 019 のレポートを読み、error の号を warning と誤判定して起票を飛ばした）。
      - name: Resolve current issue report
        run: |
          # ファイル名から取り出す番号は "017" のようにゼロ詰めされている。この文字列を
          # printf '%03d' に渡してはならない（bash は先頭 0 を8進数と解釈し 017 → 015 になる。
          # 018 のように8進数として不正な値ではエラーになる）。ゼロ詰め文字列はそのまま
          # レポートのファイル名に使い、数値が必要な箇所だけ 10# で基数を固定して変換する。
          ISSUE_NUM_PADDED=$(ls src/content/issues/issue-*.md 2>/dev/null \
            | sed 's#.*/issue-##' | sed 's#\.md$##' \
            | sort -n | tail -1)
          if [ -z "$ISSUE_NUM_PADDED" ]; then
            echo "Error: No issue file found in src/content/issues/" >&2
            exit 1
          fi
          ISSUE_NUM=$((10#$ISSUE_NUM_PADDED))
          REPORT_JSON="data/validation/validation-report-${ISSUE_NUM_PADDED}.json"
          REPORT_MD="data/validation/validation-report-${ISSUE_NUM_PADDED}.md"

          # レポートの存在確認は「コミット・デプロイ前」に済ませる（後段でやるとデプロイを止める）
          # Build issue ステップがレポートを生成するため、この時点で存在しないのは異常。
          # 2026-08-14 の本番実測（run 31792016284）では別号のレポートを誤読して
          # error を見逃したため、レポート不在を黙って許すとパイプラインの不整合が
          # 隠蔽されてしまう。ここで明示的に落として調査ログを残す。
          if [ ! -f "$REPORT_JSON" ] || [ ! -f "$REPORT_MD" ]; then
            echo "Error: Validation report not found after build-issue step." >&2
            echo "  REPORT_JSON=${REPORT_JSON} exists: $([ -f "$REPORT_JSON" ] && echo yes || echo no)" >&2
            echo "  REPORT_MD=${REPORT_MD} exists: $([ -f "$REPORT_MD" ] && echo yes || echo no)" >&2
            exit 1
          fi

          # 発行日を frontmatter から取得（auto-filed issue のタイトルに埋め込むため）
          # publishDate フィールドは build-issue.ts が `publishDate: ${dateStr}` 形式（引用符なし）で
          # 書き込むが、将来の変更や手動編集で引用符が入る可能性に備えて除去する。
          # また、フィールド自体が存在しない場合は致命的エラーとして早期に落とす
          # （Issue タイトルの一意性に必須のため、空文字での起票は許容しない）。
          PUBLISH_DATE=$(grep '^publishDate:' "src/content/issues/issue-${ISSUE_NUM_PADDED}.md" \
            | sed 's/publishDate: *//' | tr -d '\r' | sed 's/^"\(.*\)"$/\1/')
          if [ -z "$PUBLISH_DATE" ]; then
            echo "Error: publishDate field is missing or empty in issue-${ISSUE_NUM_PADDED}.md" >&2
            exit 1
          fi

          {
            echo "ISSUE_NUM=${ISSUE_NUM}"
            echo "REPORT_JSON=${REPORT_JSON}"
            echo "REPORT_MD=${REPORT_MD}"
            echo "PUBLISH_DATE_RESOLVED=${PUBLISH_DATE}"
          } >> "$GITHUB_ENV"

          # GITHUB_ENV は後続ステップにしか効かないので、ログ出力はローカル変数を使う
          echo "Resolved: issue #${ISSUE_NUM} (file suffix ${ISSUE_NUM_PADDED}), publishDate=${PUBLISH_DATE}"
          echo "  REPORT_JSON=${REPORT_JSON}"
          echo "  REPORT_MD=${REPORT_MD}"

      # 6.5. バリデーションレポートを Job Summary に出力
      #      整形は scripts/format-validation-report.ts が生成する .md をそのまま利用する
      - name: Validation report summary
        if: always()
        run: |
          if [ ! -f "$REPORT_MD" ]; then
            echo "## ⚠️ Article Validation Report" >> "$GITHUB_STEP_SUMMARY"
            echo "レポートファイルが見つかりませんでした。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat "$REPORT_MD" >> "$GITHUB_STEP_SUMMARY"

      # 6.6. history.json の JSON 整合性チェック
      - name: Validate history.json
        run: jq empty src/content/history.json

      # 7. 生成した記事をコミット＆プッシュ
      - name: Commit and push generated content
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/issues/ src/content/history.json
          [ -d "public/images/features" ] && git add public/images/features/ || true
          # 本番 validation レポート（JSON=調査用 / Markdown=人間向け）をリポジトリに保存（Issue #202）
          [ -d "data/validation" ] && git add data/validation/ || true
          # 号を指す日付なので JST で表記する（runner の TZ は UTC で、schedule 実行では
          # 金曜になってしまう）。発行日そのものの決定は generate-articles.ts 側で
          # JST 化済み（Issue #308）で、こちらはコミットメッセージの表記のみ
          git diff --staged --quiet || git commit -m "Add issue for $(TZ=Asia/Tokyo date '+%Y-%m-%d')"
          git stash --include-untracked || true
          git pull --rebase origin main
          git stash pop || true
          jq empty src/content/history.json
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7.5. 総合ステータスが error の号は Issue を自動起票（既存があればスキップ）
      #      Commit and push 成功後のみ実行（レポートがリポジトリに保存済みであることを保証）
      - name: File issue on validation error
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          # ここでのレポート不在は「早期チェックを通ったのに消えた」異常系
          # レポートの存在確認は「Resolve current issue report」ステップで早期実施済み
          # （コミット・デプロイ前に落ちるため、ここに到達する時点でレポートは必ず存在）。
          # 万が一ここでレポートが存在しない場合でも、デプロイを止めないために exit 0 で
          # スキップする（起票ステップの失敗はデプロイをブロックすべきでない）。
          # ただし、早期チェックを通過してここで消失するケースは異常なので、明示的にログを残す。
          if [ ! -f "$REPORT_JSON" ]; then
            echo "Error: REPORT_JSON=$REPORT_JSON does not exist at issue-filing step." >&2
            echo "This should not happen after the early check in 'Resolve current issue report'." >&2
            echo "Skipping issue creation to allow deployment to proceed." >&2
            exit 0
          fi

          STATUS=$(jq -r '.status // "ok"' "$REPORT_JSON")
          if [ "$STATUS" != "error" ]; then
            echo "status=${STATUS} のため起票不要です。"
            exit 0
          fi

          ISSUE_NUM=$(jq -r '.issueNumber' "$REPORT_JSON")
          HIGH=$(jq -r '.warningsBySeverity.high' "$REPORT_JSON")
          # Issue #349: searchFailures と pageContentFailures を分離（性質が異なる）
          SEARCH_FAIL=$(jq -r '.webSearchStats.searchFailures // 0' "$REPORT_JSON")
          PAGE_CONTENT_FAIL=$(jq -r '.webSearchStats.pageContentFailures // 0' "$REPORT_JSON")
          ADULT=$(jq -r '.webSearchStats.adultScreeningFailures // 0' "$REPORT_JSON")
          SHORTFALL=$(jq -r '.articleCountShortfalls // [] | length' "$REPORT_JSON")
          # HIGH 以外の要因（検索失敗 / 公式ページ本文取得失敗 / AI成人向けスクリーニング失敗 / 記事本数の不足）だけで
          # 起票された場合、HIGH件数だけのタイトルだと「HIGH: 0件」という矛盾した表記になる。
          # 新しい要因が 0 のときは従来通りの表記を維持する（重複防止ロジックが旧Issueと
          # 一致し続けるように保つため、条件付きで後ろに足すだけにする）。
          # （Issue #222 / #311 / #349 対応。pageContentFailures は warning 扱いだが、
          #   実測で単独で error になるケースがあったため、タイトルから漏れないよう明示する）
          DETAIL="HIGH: ${HIGH}件"
          if [ "$SEARCH_FAIL" != "0" ]; then
            DETAIL="${DETAIL}、検索失敗: ${SEARCH_FAIL}件"
          fi
          if [ "$PAGE_CONTENT_FAIL" != "0" ]; then
            DETAIL="${DETAIL}、公式ページ本文取得の失敗: ${PAGE_CONTENT_FAIL}件"
          fi
          if [ "$ADULT" != "0" ]; then
            DETAIL="${DETAIL}、AI成人向けスクリーニング失敗: ${ADULT}件"
          fi
          if [ "$SHORTFALL" != "0" ]; then
            DETAIL="${DETAIL}、記事本数の不足: ${SHORTFALL}カテゴリ"
          fi
          # 号の再利用（削除→再発行）があるため、タイトルに発行日を埋め込んで一意にする。
          # 例: #206（Vol.17 最初の生成、2026-07-24発行）がクローズ済みでも、
          # 同じVol.17を2026-08-15に再生成してerrorになった場合は別Issueとして起票したい。
          TITLE="⚠️ 第${ISSUE_NUM}号（${PUBLISH_DATE_RESOLVED} 発行）検証で要対応の問題（${DETAIL}）"

          # 重複防止の判定はタイトルの完全一致
          # 同一タイトルの Issue が既にあれば起票しない（重複防止）。タイトルには発行日が
          # 含まれるため、同じ号番号でも異なる日に再生成した場合は別 Issue として起票される。
          # 逆に、同じ号番号・同じ発行日・同じ要因内訳で再実行した場合は、過去に起票された
          # Issue が既にクローズされていてもスキップされる（--state all で検索するため）。
          # GitHub 検索インデックスは即時反映されないため、全件取得してローカルで完全一致フィルタする。
          EXISTING=$(gh issue list --state all --limit 100 --json title \
            --jq "[.[] | select(.title == \"${TITLE}\")] | length")
          if [ "$EXISTING" != "0" ]; then
            echo "既存の Issue があるため起票をスキップします: ${TITLE}"
            exit 0
          fi

          # F1: validation ラベルを冪等に作成（存在しなければ作る、あれば何もしない）
          gh label create validation --description "Validation report issue" --color "e11d48" --force || true

          {
            cat "$REPORT_MD"
            echo ""
            echo "---"
            echo "調査用の詳細レポート: \`${REPORT_JSON}\`（main ブランチにコミット済みの場合はリポジトリから参照可能）"
            echo ""
            echo "🤖 このIssueは weekly-build ワークフローが自動起票しました。"
          } > /tmp/issue-body.md

          gh issue create --title "${TITLE}" --body-file /tmp/issue-body.md --label validation

      # 8. Astro ビルド
      - name: Build Astro site
        run: npm run build

      # 9. Cloudflare Pages にデプロイ
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=game-wire --commit-dirty=true

      # 11. 完了通知（サマリー）
      - name: Build summary
        run: |
          echo "## 🎮 Game Wire Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Publish Date**: ${{ inputs.publish_date || 'Today' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Deployed to Cloudflare Pages" >> $GITHUB_STEP_SUMMARY
          if [ -f "$REPORT_JSON" ]; then
            HIGH=$(jq '.warningsBySeverity.high' "$REPORT_JSON")
            TOTAL=$(jq '.totalWarnings' "$REPORT_JSON")
            STATUS=$(jq -r '.status // "ok"' "$REPORT_JSON")
            echo "- **Validation**: status=${STATUS} / 警告 ${TOTAL}件（HIGH: ${HIGH}件）" >> $GITHUB_STEP_SUMMARY
          fi
